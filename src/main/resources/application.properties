spring.application.name=spring-jwt-auth-starter

# Default profile: in-memory H2 so the app runs with zero setup.
# Use the "postgres" profile (see application-postgres.properties) for a real database.
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT settings. Override JWT_SECRET in every real environment
# (generate one with: openssl rand -base64 64).
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLXRoaXMtaXMtNjQtYnl0ZXMtbG9uZyEhIQ==}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d
app.jwt.issuer=spring-jwt-auth-starter

# Admin account created on first start if it does not exist.
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}

management.endpoints.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
